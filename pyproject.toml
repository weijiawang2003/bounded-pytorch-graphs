[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintable-feature-graphs"
version = "0.1.0"
description = "Bounded JSON-defined PyTorch feature-token graphs with deterministic CPU execution"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.7,<3", "threadpoolctl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "joblib>=1.4,<2", "scipy>=1.12,<2", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
include = ["fintable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
